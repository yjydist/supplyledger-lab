        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/identities/orderer/orderer2-tls/msp
        target: /run/supply/tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/identities/orderer/orderer2-admin-server-tls/msp
        target: /run/supply/admin-server-tls
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/trust/orderer-admin-tls-ca.pem
        target: /run/supply/admin-client-root.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/trust/orderer-tls-ca.pem
        target: /run/supply/client-roots/orderer.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/trust/seller-tls-ca.pem
        target: /run/supply/client-roots/seller.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/trust/buyer-tls-ca.pem
        target: /run/supply/client-roots/buyer.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.runtime/trust/carrier-tls-ca.pem
        target: /run/supply/client-roots/carrier.pem
        read_only: true
        bind: {create_host_path: false}
  peer0-seller:
    <<: *peer
    env_file:
      - path: ../.secrets/peer-couchdb/seller.env
        required: false
    networks:
      fabric:
        aliases: [peer0.seller.supply.test]
      seller:
        aliases: [peer0.seller.supply.test]
    volumes:
      - type: volume
        source: peer0-seller-ledger
