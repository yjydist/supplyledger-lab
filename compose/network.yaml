networks:
  fabric:
    name: supply-fabric

volumes:
  orderer0-ledger:
    name: supplyledger_orderer0_ledger
    labels: {supplyledger.reset: allow}
  orderer1-ledger:
    name: supplyledger_orderer1_ledger
    labels: {supplyledger.reset: allow}
  orderer2-ledger:
    name: supplyledger_orderer2_ledger
    labels: {supplyledger.reset: allow}
  peer0-seller-ledger:
    name: supplyledger_peer0_seller_ledger
    labels: {supplyledger.reset: allow}
  peer0-buyer-ledger:
    name: supplyledger_peer0_buyer_ledger
    labels: {supplyledger.reset: allow}
  peer0-carrier-ledger:
    name: supplyledger_peer0_carrier_ledger
    labels: {supplyledger.reset: allow}
  couchdb0-seller-data:
    name: supplyledger_couchdb0_seller_data
    labels: {supplyledger.reset: allow}
  couchdb0-buyer-data:
    name: supplyledger_couchdb0_buyer_data
    labels: {supplyledger.reset: allow}
  couchdb0-carrier-data:
    name: supplyledger_couchdb0_carrier_data
    labels: {supplyledger.reset: allow}
