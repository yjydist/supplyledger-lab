# M2 #16 source template. CouchDB credentials are supplied by the ignored
# per-organization Peer env file; this file must contain no password.
peer:
  id: peer0.carrier.supply.test
  networkId: supplyledger
  listenAddress: 0.0.0.0:7051
  address: peer0.carrier.supply.test:7051
  addressAutoDetect: false
  mspConfigPath: /run/supply/msp
  localMspId: CarrierMSP
  fileSystemPath: /var/hyperledger/production
  BCCSP:
    Default: SW
    SW:
      Hash: SHA2
      Security: 256
      FileKeyStore:
        KeyStore: /run/supply/msp/keystore
  gateway:
    enabled: true
  gossip:
    bootstrap: ""
    externalEndpoint: peer0.carrier.supply.test:7051
    orgLeader: true
    useLeaderElection: false
    state:
      enabled: false
  deliveryclient:
    blockGossipEnabled: false
  tls:
    enabled: true
    clientAuthRequired: true
    clientRootCAs:
      files:
        - /run/supply/client-roots/seller.pem
        - /run/supply/client-roots/buyer.pem
        - /run/supply/peer-tls-root.pem
    cert:
      file: /run/supply/tls/signcerts/cert.pem
    key:
      file: /run/supply/tls/keystore/__PEER_TLS_KEY__
    rootcert:
      file: /run/supply/peer-tls-root.pem
    clientCert:
      file: /run/supply/tls/signcerts/cert.pem
    clientKey:
      file: /run/supply/tls/keystore/__PEER_TLS_KEY__
ledger:
  state:
    stateDatabase: CouchDB
    couchDBConfig:
      couchDBAddress: couchdb0.carrier.supply.test:5984
      # username/password are intentionally absent; private CORE_* env only.
  history:
    enableHistoryDatabase: true
  snapshots:
    rootDir: /var/hyperledger/production/snapshots
chaincode:
  # Fabric v3.1.5 deploys these built-in system chaincodes in process.
  system:
    _lifecycle: enable
    cscc: enable
    qscc: enable
  # M2 denies all package installs. M3 #22 supplies the functional own builder.
  externalBuilders:
    - {name: m2-chaincode-disabled, path: /opt/supplyledger/m2-chaincode-disabled}
operations:
  listenAddress: 0.0.0.0:9444
  tls:
    enabled: true
    cert:
      file: /run/supply/tls/signcerts/cert.pem
    key:
      file: /run/supply/tls/keystore/__PEER_TLS_KEY__
    clientAuthRequired: true
    clientRootCAs:
      files:
        - /run/supply/peer-tls-root.pem
metrics:
  provider: prometheus
